file-root: ".."

ocr:
  file-root: "models"
  keys-path: "ppocr_keys_v6.txt"
  det:
    model-path: "det.bin"
    param-path: "det.param"
  rec:
    model-path: "rec.bin"
    param-path: "rec.param"


refresh: on
refresh-interval: 100ms

dictionary-path: "dictionaries/cedict_ts.u8"

style-path: ~
width: 256
height: 384

anki:
  note-type: "Chinese Card Cloze"
  deck-name: "中文::看句子练习句子"
  note-tags:
    - "iwra"
  api-key: ~

  connection-timeout: 0ms

  note-fields:
    sentence: "{cloze-sentence}"
    hanzi: "{simp}"
    pinyin: "{pinyin}"
    definition (word): "{definition}"
    definition (sentence): ""

